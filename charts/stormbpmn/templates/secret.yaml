{{/*
Secret с чувствительными ENV. Создаётся, если не задан existingSecret.

Ключи:
  - JDBC_PASSWORD, JWTSECRET           — всегда
  - LICENSE_KEY_V2 / LICENSE_KEY       — если заданы (v2 приоритетнее)
  - S3_ACCESS_KEY, S3_SECRET_KEY       — если задан storm.s3.endpoint
  - SMTP_PASSWORD                      — если storm.email.provider == smtp
  - LISTMONK_PASSWORD                  — если storm.email.provider == listmonk
  - AUDIT_DB_PASSWORD                  — если включён аудит в канал database

При existingSecret нужные ключи готовите в своём Secret с теми же именами.
*/}}
{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "stormbpmn.secretName" . }}
  labels:
    {{- include "stormbpmn.labels" . | nindent 4 }}
type: Opaque
stringData:
  JDBC_PASSWORD: {{ .Values.storm.database.password | quote }}
  JWTSECRET: {{ .Values.storm.jwt.secret | quote }}
  {{- with .Values.storm.license.keyV2 }}
  LICENSE_KEY_V2: {{ . | quote }}
  {{- end }}
  {{- with .Values.storm.license.key }}
  LICENSE_KEY: {{ . | quote }}
  {{- end }}
  {{- if .Values.storm.s3.endpoint }}
  S3_ACCESS_KEY: {{ .Values.storm.s3.accessKey | default "" | quote }}
  S3_SECRET_KEY: {{ .Values.storm.s3.secretKey | default "" | quote }}
  {{- end }}
  {{- if eq .Values.storm.email.provider "smtp" }}
  SMTP_PASSWORD: {{ .Values.storm.email.smtp.password | default "" | quote }}
  {{- end }}
  {{- if eq .Values.storm.email.provider "listmonk" }}
  LISTMONK_PASSWORD: {{ .Values.storm.email.listmonk.password | default "" | quote }}
  {{- end }}
  {{- if and (eq (.Values.storm.audit.enabled | toString) "true") (eq .Values.storm.audit.channel "database") }}
  AUDIT_DB_PASSWORD: {{ .Values.storm.audit.database.password | default "" | quote }}
  {{- end }}
{{- end }}
