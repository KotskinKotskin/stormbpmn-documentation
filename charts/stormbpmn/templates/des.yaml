{{/*
storm-des — сервис симуляций (/simulation/install.html). Разбирает очередь задач
из общей БД; балансировщик не нужен, реплики можно добавлять через des.replicaCount.
*/}}
{{- if .Values.des.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "stormbpmn.desName" . }}
  labels:
    {{- include "stormbpmn.labels" . | nindent 4 }}
    app.kubernetes.io/component: des
spec:
  replicas: {{ .Values.des.replicaCount }}
  selector:
    matchLabels:
      {{- include "stormbpmn.desSelectorLabels" . | nindent 6 }}
  template:
    metadata:
      annotations:
        {{- if not .Values.existingSecret }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
        {{- end }}
      labels:
        {{- include "stormbpmn.desSelectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "stormbpmn.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: storm-des
          image: {{ include "stormbpmn.desImage" . | quote }}
          imagePullPolicy: {{ .Values.des.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: {{ .Values.storm.database.url | quote }}
            - name: SPRING_DATASOURCE_USERNAME
              value: {{ .Values.storm.database.username | quote }}
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "stormbpmn.secretName" . }}
                  key: JDBC_PASSWORD
            # TZ обязан совпадать с приложением, иначе идущие симуляции считаются зависшими.
            - name: TZ
              value: {{ .Values.storm.general.timezone | default "Europe/Moscow" | quote }}
            - name: JAVA_OPTS
              value: {{ .Values.des.javaOpts | quote }}
            - name: SIMULATION_MAX_CONCURRENT
              value: {{ .Values.des.maxConcurrent | quote }}
            - name: SIMULATION_TIMEOUT_MINUTES
              value: {{ .Values.des.timeoutMinutes | quote }}
            - name: DES_NODE_ID
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            {{- with .Values.des.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          startupProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            failureThreshold: 30
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: http
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            {{- toYaml .Values.des.resources | nindent 12 }}
      {{- with .Values.des.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.des.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.des.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "stormbpmn.desName" . }}
  labels:
    {{- include "stormbpmn.labels" . | nindent 4 }}
    app.kubernetes.io/component: des
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.des.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "stormbpmn.desSelectorLabels" . | nindent 4 }}
{{- end }}
